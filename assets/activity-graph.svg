<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title description">
  <title id="title">GitHub activity mix, past 365 days</title>
  <desc id="description">Code reviews: 1%, Issues: 8%, Pull requests: 8%, Commits: 83%. Updated 2026-10-07. Counts include accessible private repositories. Code reviews use a 1% display minimum because the account owner reports reviews that the API omits.</desc>
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .pill { fill: #f6f8fa; stroke: #d0d7de; }
