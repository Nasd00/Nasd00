<circle cx="310.0" cy="218.4" r="4.5" class="marker"><title>Pull requests: 8% (33 contributions)</title></circle>
<circle cx="170.0" cy="205.0" r="4.5" class="marker"><title>Commits: 84% (346 contributions)</title></circle>
  <text class="percent" x="310" y="28" text-anchor="middle">0%</text>
