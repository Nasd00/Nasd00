name: Update activity graph

on:
  push:
    branches:
      - main
      - contribution-activity-graph
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Render contribution mix
        env:
          GH_PROFILE_TOKEN: ${{ secrets.GH_PROFILE_TOKEN }}
        run: python3 generate_activity_graph.py
      - name: Commit updated graph
        run: |
          git config user.name "Leo Lu"
          git config user.email "155337784+Nasd00@users.noreply.github.com"
          git add assets/activity-graph.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update activity graph"
          git push
